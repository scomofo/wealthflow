name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  windows-header:
    name: Windows Header Layout
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Check native caption separation and clickable header controls
        run: npm run test:header
        env:
          HEADER_QA_OUTPUT: artifacts/header-layout
      - name: Upload header screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-header-layout
          path: artifacts/header-layout
          if-no-files-found: ignore
